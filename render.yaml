services:
  - type: web
    name: freedogs-dark-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        value: "8248647747"
      - key: BOT_USERNAME
        value: FREEDOGSDARKBOT
